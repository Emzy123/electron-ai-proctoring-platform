apiVersion: apps/v1
kind: Deployment
metadata:
  name: custech-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: custech-gateway
  template:
    metadata:
      labels:
        app: custech-gateway
    spec:
      containers:
        - name: gateway
          image: custech-gateway:latest
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: custech-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: custech-gateway
spec:
  selector:
    app: custech-gateway
  ports:
    - port: 5000
      targetPort: 5000
