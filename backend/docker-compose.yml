services:
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/custech-exam
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CLIENT_URL=http://localhost:5173,app://.
      - NODE_ENV=development
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - minio
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  inference-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node inference/worker.js
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/custech-exam
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - INFERENCE_URL=http://tensorflow-serving:8501
    depends_on:
      - mongodb
      - rabbitmq
      - tensorflow-serving
    restart: unless-stopped

  tensorflow-serving:
    image: tensorflow/serving:2.14.0
    ports:
      - "8501:8501"
    environment:
      - MODEL_NAME=face_detection
    volumes:
      - ./backend/inference/models:/models
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongodb_data:
  minio_data:
